<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    font-family:sans-serif;
}

.box{
    width:350px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    color:white;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#7c3aed;
    border:none;
    color:white;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="box">

<h1>Login</h1>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>
Don't have account?
<a href="signup.html">Signup</a>
</p>

</div>

</body>
</html>
