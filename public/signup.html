<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raate Rangin - Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(
        135deg,
        #050816,
        #0f172a,
        #111827
    );
    overflow:hidden;
}

/* Background Glow */

body::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#7c3aed;
    border-radius:50%;
    filter:blur(150px);
    top:-100px;
    left:-100px;
    opacity:0.5;
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(150px);
    bottom:-100px;
    right:-100px;
    opacity:0.4;
}

.signup-box{
    position:relative;
    width:380px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    z-index:10;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:600;
    color:white;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
    font-size:14px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(255,255,255,0.07);
    color:white;
    font-size:15px;
    transition:0.3s;
}

.input-box input:focus{
    border:1px solid #7c3aed;
    box-shadow:0 0 15px rgba(124,58,237,0.5);
}

.input-box input::placeholder{
    color:#94a3b8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(124,58,237,0.4);
}

.login-link{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
    font-size:14px;
}

.login-link a{
    color:#8b5cf6;
    text-decoration:none;
    font-weight:500;
}

.login-link a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        Raate Rangin
    </div>

    <div class="subtitle">
        Create your account and enter the vibe
    </div>

    <form action="/signup" method="POST">

        <div class="input-box">
            <input 
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >
        </div>

        <div class="input-box">
            <input 
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </div>

</div>

</body>
</html>
