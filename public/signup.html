<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup</title>
</head>
<body>

<form action="/signup" method="POST">

    <input 
        type="email"
        name="email"
        placeholder="Enter Email"
        required
    >

    <input 
        type="password"
        name="password"
        placeholder="Enter Password"
        required
    >

    <button type="submit">
        Sign Up
    </button>

</form>
<a href="login.html">Login</a>

</body>
</html>
