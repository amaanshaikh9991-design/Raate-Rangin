<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    font-family:sans-serif;
}

.box{
    width:350px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    color:white;
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#22d3ee;
    color:black;
    cursor:pointer;
    font-size:16px;
}

a{
    color:#22d3ee;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="box">
    <h1>Create Account</h1>

    <form action="/signup" method="POST">

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Sign Up</button>
    </form>

    <p style="text-align:center;margin-top:15px;">
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>

</body>
</html>
